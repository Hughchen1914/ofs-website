<title>佛手柑 BERGAMOT · OFS</title>
<style>
:root{--ink:#8FA82E;--deep:#1E3A32;--muted:#7B8C84;--line:#E6EFE9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#FAFCFA;color:#22302B;
 font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
 line-height:1.65;padding-bottom:40px}

 padding:38px 24px 26px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:600}
h1{margin:14px 0 2px;font-size:38px;letter-spacing:.02em;color:var(--deep);font-weight:700}
.en{font-size:14px;letter-spacing:.16em;color:#8FA82E;font-weight:700}
.lat{font-family:Baskerville,Georgia,serif;font-style:italic;color:var(--muted);font-size:15px;margin-top:2px}
.tagline{margin-top:16px;font-size:14px;color:#4A5F57}
.wrap{padding:8px 24px}
.sec{margin-top:26px}
.sec h2{font-size:12px;letter-spacing:.18em;color:#8FA82E;margin:0 0 12px;font-weight:700}
.row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.k{flex:0 0 54px;font-size:13px;color:var(--muted);font-weight:600;padding-top:2px}

 font-size:13.5px;color:#7A5B1E}

<div class="hero">
  <div class="brand">OFS · ORIENT FRAGRANCE SCIENCE</div>
  <h1>佛手柑</h1>
  <div class="en">BERGAMOT</div>
  <div class="lat">Citrus bergamia</div>
  <div class="tagline">清甜柑橘带花香，微苦回甘<br><span style="color:#7B8C84;font-size:13px">意大利 卡拉布里亚 · 20 ML 纯精油</span></div>
</div>
<div class="wrap">
  <div class="sec"><h2>主 要 作 用</h2><div class="box"><div class="row"><div class="k">情绪</div><div class="v">舒缓紧张与低落，让心情变得轻快</div></div><div class="row"><div class="k">空气</div><div class="v">净化空间异味，留下清透果香</div></div><div class="row"><div class="k">肌肤</div><div class="v">帮助平衡油脂，适合油性肌肤调油</div></div></div></div>
  <div class="sec"><h2>怎 么 用</h2><div class="box"><div class="row"><div class="k">扩香</div><div class="v">3–5 滴入扩香仪，15–30 分钟</div></div><div class="row"><div class="k">按摩</div><div class="v">稀释 2%（10ml 基础油 + 4 滴）</div></div><div class="row"><div class="k">护肤</div><div class="v">稀释 0.5%，晚间使用</div></div></div></div>
  <div class="sec"><h2>注 意</h2><div class="warn">含呋喃香豆素，涂抹后 12 小时内避免日晒；孕妇及 6 岁以下儿童慎用。</div></div>
